[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-paper-finder"
version = "0.3.0"
description = "Batch paper information cards with DOI, affiliations, sourced journal metrics and official links"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5"]
dev = ["pypdf>=5", "PyYAML>=6"]

[project.scripts]
wechat-paper-finder = "paper_finder:main"

[tool.setuptools]
py-modules = ["paper_finder", "research_prepare", "basic_cards"]
package-dir = {"" = "scripts"}
